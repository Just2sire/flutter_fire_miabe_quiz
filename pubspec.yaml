name: miabe_quiz
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.3.0
  lucide_icons_flutter: ^3.1.15
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
   - assets/
   - assets/fonts/
   - assets/images/
   - assets/data/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
    
